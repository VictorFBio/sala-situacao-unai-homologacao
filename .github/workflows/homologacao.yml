name: Homologar ecossistema
on:
  workflow_dispatch:
    inputs:
      publisher_revision:
        description: Commit completo do publicador (40 caracteres; obrigatório para integrado)
        type: string
        required: false
      pacote:
        description: Integrar módulos ou ensaiar recuperação do pacote de referência
        type: choice
        options: [integrado, referencia]
        default: integrado
        required: true
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validar referência sem executar entrada como comando
        env:
          REVISION: ${{ inputs.publisher_revision }}
          PACKAGE: ${{ inputs.pacote }}
        run: |
          node -e 'if(process.env.PACKAGE === "integrado" && !/^[a-f0-9]{40}$/.test(process.env.REVISION)) throw Error("Informe commit completo")'
      - name: Baixar publicador aprovado
        if: inputs.pacote == 'integrado'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: VictorFBio/sala-situacao-unai-v2
          ref: ${{ inputs.publisher_revision }}
          path: publisher
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Recuperar pacote anterior e verificar checksum
        run: |
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const response=await fetch('https://github.com/VictorFBio/sala-situacao-unai-homologacao/releases/download/base-109d7d5/publicacao-109d7d5.zip',{signal:AbortSignal.timeout(60000)});
          if(!response.ok) throw Error(`Backup indisponível: ${response.status}`);
          const data=Buffer.from(await response.arrayBuffer());
          if(createHash('sha256').update(data).digest('hex')!=='df8ccea778dd09bf2c71eb28997b74c0fb624e4669da1a0322a69364450bab33') throw Error('Checksum do backup divergente');
          await writeFile('backup.zip',data);
          NODE
          unzip -q backup.zip -d legacy
      - name: Instalar dependências do painel
        if: inputs.pacote == 'integrado'
        working-directory: publisher
        run: npm ci
      - name: Verificar dependências
        if: inputs.pacote == 'integrado'
        working-directory: publisher
        run: npm audit --audit-level=high
      - name: Compilar e verificar módulos
        if: inputs.pacote == 'integrado'
        working-directory: publisher
        run: node scripts/compose-site.mjs --legacy=../legacy/dist --base=/sala-situacao-unai-homologacao/ --environment=homologacao
      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Enviar pacote integrado
        if: inputs.pacote == 'integrado'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: publisher/dist-ecossistema
          retention-days: 1
      - name: Enviar pacote de recuperação
        if: inputs.pacote == 'referencia'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: legacy/dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar somente na homologação
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
